name: Test Disco Offline Network Boundary

on:
  push:
    branches:
      - fix/disco-offline-network

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run Disco Inferno regression suites
        run: |
          python -m pytest -q \
            tests/test_disco_inferno.py \
            tests/test_disco_inferno_offline_sdoh.py \
            tests/test_disco_inferno_process_control.py
